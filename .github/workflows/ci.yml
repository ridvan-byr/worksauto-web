name: Web CI / CD & Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Static Type Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint --if-present

      - name: Validate TypeScript Compilation
        run: npx tsc --noEmit

  build:
    name: Production Build Verification
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

  deploy-production:
    name: Production Deployment Gate (Manual Approval)
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy Notice (Secrets Missing)
        if: "${{ secrets.PROD_HOST == '' }}"
        run: echo "Production secret PROD_HOST is not configured yet. Skipping remote deployment. CI/CD checks passed successfully."

      - name: Deploy to Production Server via SSH
        if: "${{ secrets.PROD_HOST != '' }}"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          script: |
            cd /opt/worksauto/worksauto-web
            git pull origin main
            npm ci --omit=dev
            npm run build
            pm2 reload worksauto-web || pm2 start "npm start" --name worksauto-web

